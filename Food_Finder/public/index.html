<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff9ee">
  <title>FOODFINDER - Find something yummy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

    :root {
      color-scheme: light;
      --cream: #fff9ee;
      --paper: #fffdf8;
      --ink: #393a32;
      --muted: #77776e;
      --sage: #d7dfc7;
      --sage-deep: #68745b;
      --mustard: #deb153;
      --peach: #ffb87c;
      --coral: #e77969;
      --mauve: #a47a8b;
      --line: #e8dfd0;
      --shadow: 0 12px 30px rgba(87, 69, 49, 0.08);
    }

    * { box-sizing: border-box; }
    * { box-sizing: border-box; }
    body { margin: 0; background-color: var(--cream); background-image: radial-gradient(rgba(164, 122, 139, 0.09) 0.8px, transparent 0.8px); background-size: 18px 18px; color: var(--ink); font-family: "DM Sans", sans-serif; }
    button, input, select { font: inherit; }
    button, select { color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.52; transform: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .site-header { position: relative; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); }
    .header-inner, .layout { width: min(1440px, 100%); margin: 0 auto; }
    .header-inner { min-height: 82px; padding: 14px 34px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 800; letter-spacing: 0.08em; }
    .brand-mark { display: grid; width: 44px; aspect-ratio: 1; place-items: center; border: 1px solid rgba(57, 58, 50, 0.08); border-radius: 8px; background: var(--mustard); font-size: 23px; }
    .site-nav { display: flex; align-items: center; gap: 8px; }
    .site-nav a { padding: 10px 14px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; }
    .site-nav a:hover { background: var(--sage); color: var(--ink); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 322px; gap: 30px; padding: 32px 34px 60px; align-items: start; }
    .food-column, .sidebar { min-width: 0; }
    .hero { position: relative; overflow: hidden; min-height: 216px; margin-bottom: 24px; padding: 34px 38px; display: flex; align-items: center; border: 1px solid rgba(104, 116, 91, 0.15); border-radius: 8px; background: var(--sage); }
    .hero::after { content: "✿"; position: absolute; right: 7%; bottom: -37px; color: rgba(164, 122, 139, 0.35); font-size: 178px; line-height: 1; transform: rotate(-13deg); pointer-events: none; }
    .hero-copy { position: relative; z-index: 1; max-width: 610px; }
    .eyebrow { margin: 0 0 9px; color: var(--sage-deep); font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    .hero h1 { max-width: 560px; margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 46px; font-weight: 600; line-height: 1.08; }
    .hero-copy > p:last-child { margin: 12px 0 0; color: #55594d; font-size: 16px; }
    .search-form { display: flex; gap: 9px; margin: 0 0 20px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: 0 5px 18px rgba(87, 69, 49, 0.05); }
    .search-form input, .filter-control select { min-width: 0; min-height: 46px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink); }
    .search-form input { flex: 1; padding: 0 14px; }
    .search-form input::placeholder { color: #99958b; }
    .button { min-height: 44px; padding: 0 17px; border: 1px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 800; transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease; }
    .button:hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(57, 58, 50, 0.12); }
    .button-coral { background: var(--coral); color: #fff; }
    .button-coral:hover { background: #d86b5c; }
    .button-mauve { background: var(--mauve); color: #fff; }
    .button-mauve:hover { background: #916b7b; }
    .button-mustard { background: var(--mustard); color: #3f392d; }
    .button-mustard:hover { background: #d2a344; }
    .browse-tools { margin-bottom: 27px; padding: 16px; display: grid; grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) auto auto; align-items: end; gap: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .filter-control { display: grid; gap: 6px; min-width: 0; }
    .filter-control span, .sort-label { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
    .filter-control select { width: 100%; min-height: 42px; padding: 0 34px 0 12px; border-color: var(--line); background-color: var(--paper); }
    .sort-control { display: grid; gap: 6px; }
    .sort-buttons { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
    .sort-buttons button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; }
    .sort-buttons button:hover, .sort-buttons button:focus-visible { background: var(--sage); color: var(--ink); outline-offset: 1px; }
    .random-button { white-space: nowrap; }
    .section-heading { margin-bottom: 16px; display: flex; align-items: end; justify-content: space-between; gap: 14px; }
    .section-heading h2 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 27px; font-weight: 600; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    #sortInfo { color: var(--sage-deep); font-size: 12px; font-weight: 700; text-align: right; }
    #meals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .meal-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: 0 5px 18px rgba(87, 69, 49, 0.055); transition: transform 160ms ease, box-shadow 160ms ease; }
    .meal-card:hover, .meal-card:focus-within { transform: translateY(-3px); box-shadow: var(--shadow); }
    .meal-card[role="link"] { cursor: pointer; }
    .meal-image-wrapper { position: relative; overflow: hidden; aspect-ratio: 1.18 / 1; background: var(--peach); }
    .meal-image { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 280ms ease; }
    .meal-card:hover .meal-image { transform: scale(1.035); }
    .meal-content { padding: 14px; }
    .meal-name { min-height: 44px; margin: 0 0 10px; font-family: "Fraunces", Georgia, serif; font-size: 17px; font-weight: 600; line-height: 1.3; }
    .meal-meta { min-height: 25px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 8px; border-radius: 6px; background: var(--sage); color: #4f5b43; font-size: 10px; font-weight: 800; }
    .tag.area-tag { background: #f7e1d0; color: #875637; }
    .meal-actions { display: flex; }
    .meal-actions .button { width: 100%; }
    .queue-panel { position: sticky; top: 22px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }
    .queue-header { padding: 20px 20px 15px; border-bottom: 1px solid var(--line); background: #fff4e5; }
    .queue-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .queue-header h2 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 600; }
    .queue-count { min-width: 34px; height: 34px; padding: 0 8px; display: grid; place-items: center; border-radius: 8px; background: var(--mustard); font-size: 13px; font-weight: 800; }
    .queue-header p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .queue-list { margin: 0; padding: 8px 18px; list-style: none; }
    .queue-item { min-width: 0; padding: 12px 0; display: grid; grid-template-columns: 27px 54px minmax(0, 1fr); align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
    .queue-item:last-child { border-bottom: 0; }
    .queue-number { color: var(--mauve); font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 700; text-align: center; }
    .queue-image { display: block; width: 54px; aspect-ratio: 1; border-radius: 8px; background: var(--sage); object-fit: cover; }
    .queue-meal { min-width: 0; display: grid; gap: 4px; }
    .queue-meal strong { overflow: hidden; font-size: 12px; line-height: 1.3; text-overflow: ellipsis; }
    .queue-meta { color: var(--muted); font-size: 10px; line-height: 1.3; }
    .queue-empty { padding: 27px 10px; color: var(--muted); font-size: 13px; text-align: center; }
    .queue-empty span { display: block; margin-bottom: 8px; font-size: 25px; }
    .queue-footer { padding: 0 18px 18px; }
    .queue-footer .button { width: 100%; }
    #detailView { display: none; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }
    .detail-toolbar { padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .back-button { padding: 8px 0; border: 0; background: transparent; color: var(--mauve); font-size: 13px; font-weight: 800; }
    .back-button:hover { color: var(--coral); }
    .detail-container { display: flex; flex-direction: column; gap: 16px; padding: 20px; }
    .detail-img { width: 100%; max-height: 430px; border-radius: 8px; background: var(--peach); object-fit: cover; }
    .detail-title { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 32px; font-weight: 600; line-height: 1.15; }
    .detail-id { color: var(--muted); font-size: 12px; }
    .detail-badge-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-badge { padding: 7px 10px; border-radius: 6px; background: var(--sage); color: #4f5b43; font-size: 12px; font-weight: 700; }
    .detail-badge.area-badge { background: #f7e1d0; color: #875637; }
    .detail-section { padding-top: 14px; border-top: 1px solid var(--line); }
    .detail-section h3 { margin: 0 0 10px; color: var(--sage-deep); font-family: "Fraunces", Georgia, serif; font-size: 20px; font-weight: 600; }
    .ingredients-list { margin: 0; padding-left: 19px; columns: 2; color: var(--ink); }
    .ingredients-list li { padding: 4px 8px 4px 0; break-inside: avoid; font-size: 13px; line-height: 1.45; }
    .instructions-text { color: #55564e; font-size: 14px; line-height: 1.75; white-space: pre-line; }
    .detail-actions { padding-top: 14px; border-top: 1px solid var(--line); }
    .detail-actions .button { min-width: 180px; }
    .loading, .empty-state { grid-column: 1 / -1; padding: 45px 16px; color: var(--muted); text-align: center; }
    .empty-state h3 { margin: 8px 0; color: var(--ink); font-family: "Fraunces", Georgia, serif; font-size: 22px; }
    .empty-icon { font-size: 32px; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 12px; border: 3px solid var(--sage); border-top-color: var(--coral); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { display: none; width: min(1372px, calc(100% - 48px)); margin: 14px auto 0; padding: 12px 16px; border: 1px solid #f0c3b8; border-radius: 8px; background: #fff0eb; color: #934b40; font-size: 13px; }
    @media (max-width: 1120px) { #meals { grid-template-columns: repeat(2, minmax(0, 1fr)); } .layout { grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; } .browse-tools { grid-template-columns: 1fr 1fr auto; } .random-button { grid-column: 1 / -1; justify-self: start; } }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; padding: 24px 24px 44px; } .queue-panel { position: static; } .queue-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; } }
    @media (max-width: 560px) { .header-inner { min-height: 70px; padding: 12px 18px; } .brand { gap: 8px; font-size: 14px; } .brand-mark { width: 38px; font-size: 20px; } .site-nav { gap: 0; } .site-nav a { padding: 9px 8px; font-size: 12px; } .layout { gap: 22px; padding: 18px 16px 36px; } .hero { min-height: 190px; padding: 26px 22px; } .hero::after { right: -18px; bottom: -26px; font-size: 125px; } .hero h1 { max-width: 330px; font-size: 34px; } .hero-copy > p:last-child { max-width: 240px; font-size: 14px; } .search-form { padding: 6px; gap: 4px; } .search-form input { padding: 0 9px; font-size: 13px; } .search-button { padding-inline: 12px; } .browse-tools { grid-template-columns: 1fr 1fr; gap: 12px 9px; padding: 13px 0; } .sort-control { grid-column: 1; } .random-button { grid-column: 2; justify-self: stretch; align-self: end; padding-inline: 9px; font-size: 12px; } #meals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; } .meal-content { padding: 10px; } .meal-name { min-height: 42px; font-size: 15px; } .meal-meta { margin-bottom: 10px; gap: 4px; } .tag { padding: 4px 6px; font-size: 9px; } .meal-actions .button { min-height: 39px; padding-inline: 6px; font-size: 11px; } .section-heading { align-items: start; } .section-heading h2 { font-size: 23px; } #sortInfo { max-width: 118px; font-size: 10px; } .queue-list { grid-template-columns: 1fr; } .detail-container { padding: 15px; } .detail-title { font-size: 26px; } .ingredients-list { columns: 1; } }
    @media (max-width: 360px) { .site-nav a { padding-inline: 5px; font-size: 11px; } .brand { font-size: 12px; } #meals { grid-template-columns: 1fr; } .meal-image-wrapper { aspect-ratio: 1.35 / 1; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="FOODFINDER home">
        <span class="brand-mark" aria-hidden="true">🍳</span>
        <span>FOODFINDER</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#queuePanel">Your Queue</a>
      </nav>
    </div>
  </header>

  <div id="error" role="alert"></div>

  <main class="layout">
    <section class="food-column">
      <div id="dashboardView">
        <section class="hero" aria-labelledby="heroTitle">
          <div class="hero-copy">
            <p class="eyebrow">A little inspiration for your table</p>
            <h1 id="heroTitle">What are you craving today?</h1>
            <p>Find something yummy to cook!</p>
          </div>
        </section>

        <form class="search-form" onsubmit="event.preventDefault(); searchMeals()">
          <input type="search" id="searchInput" aria-label="Search meals" placeholder="Search for a meal...">
          <button class="button button-coral search-button" type="submit">Search</button>
        </form>

        <section class="browse-tools" aria-label="Filter and sort meals">
          <label class="filter-control" for="categoryFilter">
            <span>Category</span>
            <select id="categoryFilter" onchange="loadSearchResults()">
              <option value="">All categories</option>
            </select>
          </label>
          <label class="filter-control" for="areaFilter">
            <span>Area</span>
            <select id="areaFilter" onchange="loadSearchResults()">
              <option value="">All areas</option>
            </select>
          </label>
          <div class="sort-control">
            <span class="sort-label">Sort</span>
            <div class="sort-buttons" role="group" aria-label="Sort meals alphabetically">
              <button type="button" onclick="sortAZ()">A-Z</button>
              <button type="button" onclick="sortZA()">Z-A</button>
            </div>
          </div>
          <button class="button button-mustard random-button" type="button" onclick="randomMeal()">🎲 Random Meal</button>
        </section>

        <section class="menu-section" aria-labelledby="menuHeading">
          <div class="section-heading">
            <div>
              <h2 id="menuHeading">Today's menu</h2>
              <p id="resultInfo" aria-live="polite">Finding something tasty...</p>
            </div>
            <span id="sortInfo">A-Z</span>
          </div>
          <div id="meals">
            <div class="loading"><div class="spinner"></div><p>Setting the table...</p></div>
          </div>
        </section>
      </div>

      <section id="detailView" aria-label="Meal details">
        <div class="detail-toolbar">
          <button class="back-button" type="button" onclick="goBack()">← Back</button>
        </div>
        <div id="recipeDetailContent" class="detail-container"></div>
      </section>
    </section>

    <aside class="sidebar" aria-label="Food queue">
      <section class="queue-panel" id="queuePanel">
        <div class="queue-header">
          <div class="queue-header-row">
            <h2>Your Food Queue</h2>
            <span class="queue-count" id="queueSize">0</span>
          </div>
          <p>A little plan for what comes next.</p>
        </div>
        <ul class="queue-list" id="watchlist"><li class="queue-empty"><span>🍽️</span>Your queue is waiting for a meal.</li></ul>
        <div class="queue-footer">
          <button class="button button-mauve" id="processQueueButton" type="button" onclick="processQueue()" disabled>Next Meal</button>
        </div>
      </section>
    </aside>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
