<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Food Finder - TheMealDB</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "TH Sarabun New",
        sans-serif;

      background: #f7f3ee;

      color: #332b27;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    header {

      background: #6f4e37;

      color: white;

      padding: 25px 20px;

    }


    .header-inner {

      max-width: 1200px;

      margin: auto;

    }


    header h1 {

      margin: 0;

      font-size: 28px;

    }


    header p {

      margin: 6px 0 0;

      opacity: 0.9;

    }


    /* =========================================================
       MAIN
       ========================================================= */

    .container {

      max-width: 1200px;

      margin: auto;

      padding: 20px;

    }


    /* =========================================================
       SEARCH AREA
       ========================================================= */

    .search-panel {

      background: white;

      border-radius: 14px;

      padding: 18px;

      margin-bottom: 20px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.06);

    }


    .search-row {

      display: flex;

      gap: 10px;

      margin-bottom: 12px;

    }


    #searchInput {

      flex: 1;

      padding: 12px 15px;

      border: 1px solid #d6ccc5;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

    }


    #searchInput:focus {

      border-color: #8b684c;

    }


    .search-button {

      border: none;

      background: #6f4e37;

      color: white;

      border-radius: 8px;

      padding: 0 22px;

      cursor: pointer;

      font-weight: bold;

    }


    .filter-row {

      display: grid;

      grid-template-columns:
        1fr 1fr auto;

      gap: 10px;

    }


    select {

      padding: 10px;

      border: 1px solid #d6ccc5;

      border-radius: 8px;

      background: white;

      cursor: pointer;

    }


    .reset-button {

      border: 1px solid #6f4e37;

      background: white;

      color: #6f4e37;

      border-radius: 8px;

      padding: 0 18px;

      cursor: pointer;

    }


    /* =========================================================
       TOOLBAR
       ========================================================= */

    .toolbar {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 15px;

    }


    .sort-buttons {

      display: flex;

      gap: 8px;

    }


    .sort-button {

      border: 1px solid #cbbcaf;

      background: white;

      color: #5a4434;

      border-radius: 7px;

      padding: 8px 15px;

      cursor: pointer;

    }


    .sort-button:hover {

      background: #eee5dc;

    }


    #sortInfo {

      color: #76685e;

      font-size: 14px;

    }


    /* =========================================================
       MEAL GRID
       ========================================================= */

    #meals {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

    }


    /* =========================================================
       MEAL CARD
       ========================================================= */

    .meal-card {

      background: white;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s,
        box-shadow 0.2s;

    }


    .meal-card:hover {

      transform: translateY(-3px);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.12);

    }


    .meal-image-wrapper {

      width: 100%;

      aspect-ratio: 1 / 1;

      overflow: hidden;

    }


    .meal-image {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    .meal-content {

      padding: 14px;

    }


    .meal-name {

      margin: 0 0 10px;

      font-size: 17px;

      line-height: 1.4;

      min-height: 48px;

    }


    .meal-meta {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-bottom: 13px;

    }


    .tag {

      background: #f1e5da;

      color: #684a35;

      border-radius: 20px;

      padding: 5px 9px;

      font-size: 12px;

    }


    .tag.area {

      background: #eee8df;

    }


    .detail-button {

      width: 100%;

      border: none;

      background: #6f4e37;

      color: white;

      border-radius: 7px;

      padding: 9px;

      cursor: pointer;

    }


    .detail-button:hover {

      background: #573b29;

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .loading {

      grid-column: 1 / -1;

      text-align: center;

      padding: 60px 20px;

    }


    .spinner {

      width: 40px;

      height: 40px;

      margin: auto;

      border:
        4px solid #e4d9d0;

      border-top-color: #6f4e37;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }


    /* =========================================================
       EMPTY STATE
       ========================================================= */

    .empty-state {

      grid-column: 1 / -1;

      text-align: center;

      padding: 60px 20px;

      background: white;

      border-radius: 14px;

    }


    .empty-icon {

      font-size: 45px;

      margin-bottom: 10px;

    }


    .empty-state h3 {

      margin: 5px 0;

    }


    .empty-state p {

      color: #8a7d74;

    }


    .empty-state button {

      border: none;

      background: #6f4e37;

      color: white;

      padding: 9px 18px;

      border-radius: 7px;

      cursor: pointer;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    #error {

      display: none;

      max-width: 1200px;

      margin: 15px auto;

      padding: 12px;

      background: #fce4e4;

      color: #a22;

      border-radius: 8px;

    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1000px) {

      #meals {

        grid-template-columns:
          repeat(3, 1fr);

      }

    }


    @media (max-width: 700px) {

      .search-row {

        flex-direction: column;

      }


      .search-button {

        padding: 11px;

      }


      .filter-row {

        grid-template-columns: 1fr;

      }


      .reset-button {

        padding: 10px;

      }


      #meals {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;

      }


      .toolbar {

        flex-direction: column;

        align-items: flex-start;

      }

    }


    @media (max-width: 450px) {

      #meals {

        grid-template-columns: 1fr;

      }


      header h1 {

        font-size: 23px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header>

    <div class="header-inner">

      <h1>🍽️ Food Finder</h1>

      <p>
        ระบบค้นหาเมนูอาหารจาก TheMealDB API
      </p>

    </div>

  </header>


  <div id="error"></div>


  <main class="container">


    <!-- =======================================================
         SEARCH
         ======================================================= -->

    <section class="search-panel">

      <div class="search-row">

        <input
          type="text"
          id="searchInput"
          placeholder="ค้นหาชื่อเมนูอาหาร..."
          onkeydown="
            if(event.key === 'Enter') {
              searchMeals();
            }
          "
        >


        <button
          class="search-button"
          onclick="searchMeals()"
        >
          🔍 ค้นหา
        </button>

      </div>


      <!-- FILTER -->

      <div class="filter-row">

        <select
          id="categoryFilter"
          onchange="applyCurrentFilters()"
        >

          <option value="">
            ทุก Category
          </option>

        </select>


        <select
          id="areaFilter"
          onchange="applyCurrentFilters()"
        >

          <option value="">
            ทุก Area
          </option>

        </select>


        <button
          class="reset-button"
          onclick="resetFilter()"
        >
          ล้าง Filter
        </button>

      </div>

    </section>


    <!-- =======================================================
         TOOLBAR
         ======================================================= -->

    <div class="toolbar">

      <div class="sort-buttons">

        <button
          class="sort-button"
          onclick="sortAZ()"
        >
          A–Z
        </button>


        <button
          class="sort-button"
          onclick="sortZA()"
        >
          Z–A
        </button>

      </div>


      <span id="sortInfo">
        กำลังโหลด...
      </span>

    </div>


    <!-- =======================================================
         MEALS
         ======================================================= -->

    <section id="meals">

      <div class="loading">

        <div class="spinner"></div>

        <p>
          กำลังโหลดเมนูอาหาร...
        </p>

      </div>

    </section>

  </main>


  <script src="dashboard.js"></script>

</body>

</html>
